name: Deploy FastAPI to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.EC2_SSH_KEY }}
          known_hosts: "just-a-placeholder-so-we-dont-get-errors"

      - name: Add EC2 host to known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
            # Navigate to project directory
            cd /home/ubuntu/chatbot-rag-backend &&
            # Pull latest code
            git pull origin main &&
            # Activate virtual environment
            source venv/bin/activate &&
            # Clean up pip cache to avoid storage issues
            rm -rf ~/.cache/pip &&
            # Install dependencies
            pip install --no-cache-dir -r requirements.txt &&
            # Update .env file with secrets
            echo 'HUGGINGFACE_TOKEN=${{ secrets.HUGGINGFACE_TOKEN }}' > .env &&
            echo 'SERPAPI_KEY=${{ secrets.SERPAPI_KEY }}' >> .env &&
            echo 'FRONTEND_URL=http://${{ secrets.EC2_HOST }}:3001' >> .env &&
            chmod 600 .env &&
            # Restart the systemd service
            sudo systemctl restart fastapi-app &&
            # Ensure service is running
            sudo systemctl status fastapi-app
          "
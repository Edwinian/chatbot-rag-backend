name: Docker Deploy FastAPI to EC2

on:
  push:
    branches: [master]

env:
  DOCKER_IMAGE: fastapi-app
  EC2_DOCKER_DIR: /home/${{ secrets.EC2_USER }}/chatbot-rag-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.EC2_SSH_KEY }}
          known_hosts: ${{ secrets.EC2_HOST }}

      - name: Add EC2 to known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
          if [ $? -ne 0 ]; then
            echo "Failed to scan EC2 host key"
            exit 1
          fi

      - name: Initialize or Update Git Repository
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} '
            set -e  # Exit on error
            set -x  # Enable command tracing for debugging

            echo "Starting Git repository setup in ${{ env.EC2_DOCKER_DIR }}"
            cd "${{ env.EC2_DOCKER_DIR }}"
            echo "Changed to directory: $(pwd)"

            # Configure Git credentials
            git config --global credential.helper store
            echo "https://${{ secrets.GIT_USERNAME }}:${{ secrets.GIT_PAT }}@github.com" > ~/.git-credentials
            chmod 600 ~/.git-credentials

            if [ ! -d .git ]; then
              echo "Initializing new Git repository"
              git init
              git remote add origin "https://${{ secrets.GIT_USERNAME }}:${{ secrets.GIT_PAT }}@github.com/${{ secrets.REPO_URL }}"
              git fetch origin
              git checkout master
            else
              echo "Pulling latest changes"
              git pull origin master
            fi
            if [ $? -ne 0 ]; then
              echo "Git operations failed"
              exit 1
            fi

            # Clean up credentials
            rm -f ~/.git-credentials

            echo "Git repository setup completed"
          '
        if: success()

      - name: Create and Secure .env File
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} '
            set -e  # Exit on error
            set -x  # Enable command tracing for debugging

            echo "Creating .env file in ${{ env.EC2_DOCKER_DIR }}"
            cd "${{ env.EC2_DOCKER_DIR }}"
            echo "Changed to directory: $(pwd)"

            echo "HUGGINGFACE_TOKEN=${{ secrets.HUGGINGFACE_TOKEN }}" > .env
            echo "SERPAPI_KEY=${{ secrets.SERPAPI_KEY }}" >> .env
            echo "FRONTEND_URL=http://${{ secrets.EC2_HOST }}:3001" >> .env

            echo "Setting permissions for .env file"
            chmod 600 .env
            if [ $? -ne 0 ]; then
              echo "Failed to set .env permissions"
              exit 1
            fi

            echo ".env file creation and permissions set"
          '
        if: success()

      - name: Deploy Docker Container
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} '
            set -e  # Exit on error
            set -x  # Enable command tracing for debugging

            echo "Starting Docker deployment in ${{ env.EC2_DOCKER_DIR }}"
            cd "${{ env.EC2_DOCKER_DIR }}"
            echo "Changed to directory: $(pwd)"

            echo "Checking Docker version"
            docker --version
            if [ $? -ne 0 ]; then
              echo "Docker not installed or inaccessible"
              exit 1
            fi

            echo "Building Docker image: ${{ env.DOCKER_IMAGE }}"
            docker build -t "${{ env.DOCKER_IMAGE }}" .
            if [ $? -ne 0 ]; then
              echo "Docker build failed"
              exit 1
            fi

            echo "Stopping and removing old container"
            docker stop "${{ env.DOCKER_IMAGE }}" || true
            docker rm "${{ env.DOCKER_IMAGE }}" || true

            echo "Running new container"
            docker run -d \
              --name "${{ env.DOCKER_IMAGE }}" \
              --restart unless-stopped \
              -p 8000:8000 \
              --env-file .env \
              "${{ env.DOCKER_IMAGE }}"
            if [ $? -ne 0 ]; then
              echo "Failed to run Docker container"
              exit 1
            fi

            echo "Cleaning up unused Docker images"
            docker image prune -f
            if [ $? -ne 0 ]; then
              echo "Docker image cleanup failed"
              exit 1
            fi

            echo "Docker deployment completed successfully"
          '
        if: success()
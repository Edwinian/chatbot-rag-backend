name: Docker Deploy FastAPI to EC2

on:
  push:
    branches: [master]

env:
  DOCKER_IMAGE: fastapi-app
  EC2_DOCKER_DIR: /root/chatbot-rag-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.EC2_SSH_KEY }}
          known_hosts: ${{ secrets.EC2_HOST }}

      - name: Add EC2 to known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
          if [ $? -ne 0 ]; then
            echo "Failed to scan EC2 host key"
            exit 1
          fi

      - name: Initialize or Update Git Repository
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} '
            set -e  # Exit on error
            set -x  # Enable command tracing for debugging

            echo "Starting Git repository setup in ${{ env.EC2_DOCKER_DIR }}"
            sudo -n bash -c "cd ${{ env.EC2_DOCKER_DIR }} && pwd"
            echo "Changed to directory: $(sudo -n bash -c "cd ${{ env.EC2_DOCKER_DIR }} && pwd")"

            # Configure Git credentials
            sudo -n git config --global credential.helper store
            set +x  # Disable tracing to avoid logging sensitive data
            sudo -n bash -c "echo \"https://${{ secrets.GIT_USERNAME }}:${{ secrets.GIT_PAT }}@github.com\" > /root/.git-credentials"
            set -x  # Re-enable tracing
            sudo -n chmod 600 /root/.git-credentials
            if [ $? -ne 0 ]; then
              echo "Failed to set permissions on /root/.git-credentials"
              exit 1
            fi

            # Check if .git directory exists
            if sudo -n bash -c "[ -d ${{ env.EC2_DOCKER_DIR }}/.git ]"; then
              echo "Pulling latest changes"
              sudo -n bash -c "cd ${{ env.EC2_DOCKER_DIR }} && git fetch origin && git checkout master && git pull origin master"
            else
              echo "Initializing new Git repository"
              sudo -n bash -c "cd ${{ env.EC2_DOCKER_DIR }} && git init && git remote add origin \"https://${{ secrets.GIT_USERNAME }}:${{ secrets.GIT_PAT }}@github.com/${{ secrets.REPO_URL }}\" && git fetch origin && git checkout master"
            fi
            if [ $? -ne 0 ]; then
              echo "Git operations failed"
              exit 1
            fi

            # Clean up credentials
            sudo -n rm -f /root/.git-credentials

            echo "Git repository setup completed"
          '
        if: success()

      - name: Create and Secure .env File
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} '
            set -e  # Exit on error
            set -x  # Enable command tracing for debugging

            echo "Creating .env file in ${{ env.EC2_DOCKER_DIR }}"
            sudo -n bash -c "cd ${{ env.EC2_DOCKER_DIR }} && pwd"
            echo "Changed to directory: $(sudo -n bash -c "cd ${{ env.EC2_DOCKER_DIR }} && pwd")"

            set +x  # Disable tracing to avoid logging sensitive data
            sudo -n bash -c "echo \"HUGGINGFACE_TOKEN=${{ secrets.HUGGINGFACE_TOKEN }}\" > ${{ env.EC2_DOCKER_DIR }}/.env"
            sudo -n bash -c "echo \"SERPAPI_KEY=${{ secrets.SERPAPI_KEY }}\" >> ${{ env.EC2_DOCKER_DIR }}/.env"
            set -x  # Re-enable tracing
            sudo -n bash -c "echo \"FRONTEND_URL=http://${{ secrets.EC2_HOST }}:3001\" >> ${{ env.EC2_DOCKER_DIR }}/.env"

            echo "Setting permissions for .env file"
            sudo -n chmod 600 ${{ env.EC2_DOCKER_DIR }}/.env
            if [ $? -ne 0 ]; then
              echo "Failed to set .env permissions"
              exit 1
            fi

            echo ".env file creation and permissions set"
          '
        if: success()

      - name: Deploy Docker Container
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} '
            set -e  # Exit on error
            set -x  # Enable command tracing for debugging

            echo "Starting Docker deployment in ${{ env.EC2_DOCKER_DIR }}"
            sudo -n bash -c "cd ${{ env.EC2_DOCKER_DIR }} && pwd"
            echo "Changed to directory: $(sudo -n bash -c "cd ${{ env.EC2_DOCKER_DIR }} && pwd")"

            echo "Checking Docker version"
            sudo -n docker --version
            if [ $? -ne 0 ]; then
              echo "Docker not installed or inaccessible"
              exit 1
            fi

            echo "Checking pip version and configuration"
            sudo -n bash -c "cd ${{ env.EC2_DOCKER_DIR }} && pip --version && pip config list"

            echo "Listing requirements.txt for debugging"
            sudo -n bash -c "cd ${{ env.EC2_DOCKER_DIR }} && cat requirements.txt"

            echo "Testing pip install before Docker build"
            sudo -n bash -c "cd ${{ env.EC2_DOCKER_DIR }} && pip install --no-cache-dir torch==2.8.0+cpu --index-url https://download.pytorch.org/whl/cpu && pip install --no-cache-dir -r requirements.txt"
            if [ $? -ne 0 ]; then
              echo "pip install test failed"
              exit 1
            fi

            echo "Building Docker image: ${{ env.DOCKER_IMAGE }}"
            sudo -n bash -c "cd ${{ env.EC2_DOCKER_DIR }} && docker build -t ${{ env.DOCKER_IMAGE }} ."
            if [ $? -ne 0 ]; then
              echo "Docker build failed"
              exit 1
            fi

            echo "Stopping and removing old container"
            sudo -n docker stop "${{ env.DOCKER_IMAGE }}" || true
            sudo -n docker rm "${{ env.DOCKER_IMAGE }}" || true

            echo "Running new container"
            sudo -n bash -c "cd ${{ env.EC2_DOCKER_DIR }} && docker run -d \
              --name ${{ env.DOCKER_IMAGE }} \
              --restart unless-stopped \
              -p 8000:8000 \
              --env-file .env \
              ${{ env.DOCKER_IMAGE }}"
            if [ $? -ne 0 ]; then
              echo "Failed to run Docker container"
              exit 1
            fi

            echo "Cleaning up unused Docker images"
            sudo -n docker image prune -f
            if [ $? -ne 0 ]; then
              echo "Docker image cleanup failed"
              exit 1
            fi

            echo "Docker deployment completed successfully"
          '
        if: success()
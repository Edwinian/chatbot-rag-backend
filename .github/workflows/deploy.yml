name: Docker Deploy FastAPI to EC2

on:
  push:
    branches: [master]

env:
  DOCKER_IMAGE: fastapi-app
  EC2_DOCKER_DIR: /root/chatbot-rag-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.EC2_SSH_KEY }}
          known_hosts: ${{ secrets.EC2_HOST }}

      - name: Add EC2 to known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
          if [ $? -ne 0 ]; then
            echo "Failed to scan EC2 host key"
            exit 1
          fi

      - name: Initialize or Update Git Repository
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} '
            set -e  # Exit on error
            set -x  # Enable command tracing for debugging

            echo "Starting Git repository setup in $EC2_DOCKER_DIR"
            echo "Creating directory: $EC2_DOCKER_DIR"
            mkdir -p "$EC2_DOCKER_DIR"
            if [ $? -ne 0 ]; then
              echo "Failed to create directory $EC2_DOCKER_DIR"
              exit 1
            fi
            cd "$EC2_DOCKER_DIR"
            echo "Changed to directory: $(pwd)"

            if [ ! -d .git ]; then
              echo "Initializing new Git repository"
              git init
              git remote add origin "${{ secrets.REPO_URL }}"
              git fetch origin
              git checkout master
            else
              echo "Pulling latest changes"
              git pull origin master
            fi
            if [ $? -ne 0 ]; then
              echo "Git operations failed"
              exit 1
            fi

            echo "Git repository setup completed"
          '
        if: success()

      - name: Create and Secure .env File
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} '
            set -e  # Exit on error
            set -x  # Enable command tracing for debugging

            echo "Creating .env file in $EC2_DOCKER_DIR"
            cd "$EC2_DOCKER_DIR"
            echo "Changed to directory: $(pwd)"

            echo "HUGGINGFACE_TOKEN=${{ secrets.HUGGINGFACE_TOKEN }}" > .env
            echo "SERPAPI_KEY=${{ secrets.SERPAPI_KEY }}" >> .env
            echo "FRONTEND_URL=http://${{ secrets.EC2_HOST }}:3001" >> .env

            echo "Setting permissions for .env file"
            chmod 600 .env
            if [ $? -ne 0 ]; then
              echo "Failed to set .env permissions"
              exit 1
            fi

            echo ".env file creation and permissions set"
          '
        if: success()

      - name: Deploy Docker Container
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} '
            set -e  # Exit on error
            set -x  # Enable command tracing for debugging

            echo "Starting Docker deployment in $EC2_DOCKER_DIR"
            cd "$EC2_DOCKER_DIR"
            echo "Changed to directory: $(pwd)"

            echo "Setting up Docker Buildx"
            docker buildx create --use || true
            docker buildx inspect --bootstrap
            if [ $? -ne 0 ]; then
              echo "Docker Buildx setup failed"
              exit 1
            fi

            echo "Building Docker image: $DOCKER_IMAGE"
            docker build -t "$DOCKER_IMAGE" .
            if [ $? -ne 0 ]; then
              echo "Docker build failed"
              exit 1
            fi

            echo "Stopping and removing old container"
            docker stop "$DOCKER_IMAGE" || true
            docker rm "$DOCKER_IMAGE" || true

            echo "Running new container"
            docker run -d \
              --name "$DOCKER_IMAGE" \
              --restart unless-stopped \
              -p 8000:8000 \
              --env-file .env \
              "$DOCKER_IMAGE"
            if [ $? -ne 0 ]; then
              echo "Failed to run Docker container"
              exit 1
            fi

            echo "Cleaning up unused Docker images"
            docker image prune -f
            if [ $? -ne 0 ]; then
              echo "Docker image cleanup failed"
              exit 1
            fi

            echo "Docker deployment completed successfully"
          '
        if: success()
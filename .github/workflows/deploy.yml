name: Docker Deploy FastAPI to EC2

on:
  push:
    branches: [master]

env:
  DOCKER_IMAGE: fastapi-app
  EC2_DOCKER_DIR: /home/ubuntu/chatbot-rag-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.EC2_SSH_KEY }}
          known_hosts: "optional"

      - name: Add EC2 to known_hosts
        run: ssh-keyscan ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via Docker
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
            # 1. Navigate to project directory
            cd $EC2_DOCKER_DIR
            
            # 2. Pull latest code
            git pull origin master
            
            # 3. Build Docker image (with build cache)
            docker build -t $DOCKER_IMAGE .
            
            # 4. Stop and remove old container
            docker stop $DOCKER_IMAGE || true
            docker rm $DOCKER_IMAGE || true
            
            # 5. Run new container with:
            #    - Auto-restart on crash
            #    - Cleanup on stop
            #    - Environment variables
            #    - Network binding
            docker run -d \
              --name $DOCKER_IMAGE \
              --restart unless-stopped \
              --rm \
              -p 8000:8000 \
              -e HUGGINGFACE_TOKEN='${{ secrets.HUGGINGFACE_TOKEN }}' \
              -e SERPAPI_KEY='${{ secrets.SERPAPI_KEY }}' \
              -e FRONTEND_URL='http://${{ secrets.EC2_HOST }}:3001' \
              $DOCKER_IMAGE
              
            # 6. Cleanup unused images
            docker image prune -f
          "
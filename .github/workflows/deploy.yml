name: Docker Deploy FastAPI to EC2

on:
  push:
    branches: [master]

env:
  DOCKER_IMAGE: fastapi-app
  EC2_DOCKER_DIR: /root/chatbot-rag-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.EC2_SSH_KEY }}
          known_hosts: ${{ secrets.EC2_HOST }}

      - name: Initialize or Update Git Repository
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 1
          command: |
            ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=5 ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} '
              set -e
              set -x
              echo "Starting Git repository setup in ${{ env.EC2_DOCKER_DIR }}"
              sudo -n bash -c "cd ${{ env.EC2_DOCKER_DIR }} && pwd"
              sudo -n git config --global credential.helper store
              set +x
              sudo -n bash -c "echo \"https://${{ secrets.GIT_USERNAME }}:${{ secrets.GIT_PAT }}@github.com\" > /root/.git-credentials"
              set -x
              sudo -n chmod 600 /root/.git-credentials
              if [ $? -ne 0 ]; then
                echo "Failed to set permissions on /root/.git-credentials"
                exit 1
              fi
              if sudo -n bash -c "[ -d ${{ env.EC2_DOCKER_DIR }}/.git ]"; then
                echo "Resetting to latest origin/master"
                sudo -n bash -c "cd ${{ env.EC2_DOCKER_DIR }} && git fetch origin && git checkout master && git reset --hard origin/master"
              else
                echo "Initializing new Git repository"
                sudo -n bash -c "cd ${{ env.EC2_DOCKER_DIR }} && git init && git remote add origin \"https://${{ secrets.GIT_USERNAME }}:${{ secrets.GIT_PAT }}@github.com/${{ secrets.REPO_URL }}\" && git fetch origin && git checkout master"
              fi
              if [ $? -ne 0 ]; then
                echo "Git operations failed"
                exit 1
              fi
              sudo -n rm -f /root/.git-credentials
              echo "Git repository setup completed"
            '
        if: success()

      - name: Create and Secure .env File
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 1
          command: |
            ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=5 ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} '
              set -e
              set -x
              echo "Creating .env file in ${{ env.EC2_DOCKER_DIR }}"
              sudo -n bash -c "cd ${{ env.EC2_DOCKER_DIR }} && pwd"
              set +x
              sudo -n bash -c "echo \"HUGGINGFACE_TOKEN=${{ secrets.HUGGINGFACE_TOKEN }}\" > ${{ env.EC2_DOCKER_DIR }}/.env"
              sudo -n bash -c "echo \"SERPAPI_KEY=${{ secrets.SERPAPI_KEY }}\" >> ${{ env.EC2_DOCKER_DIR }}/.env"
              sudo -n bash -c "echo \"FRONTEND_URL=http://${{ secrets.EC2_HOST }}:3001\" >> ${{ env.EC2_DOCKER_DIR }}/.env"
              set -x
              sudo -n chmod 600 ${{ env.EC2_DOCKER_DIR }}/.env
              if [ $? -ne 0 ]; then
                echo "Failed to set .env permissions"
                exit 1
              fi
              echo ".env file creation and permissions set"
            '
        if: success()

      - name: Free Disk Space
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=5 ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} '
            set -e
            set -x
            sudo -n apt-get clean
            sudo -n docker system prune -a -f --volumes
            sudo -n rm -rf /var/lib/apt/lists/*
            sudo -n journalctl --vacuum-size=50M
          '
        if: success()

      - name: Deploy Docker Container
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 1
          command: |
            ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=5 ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} '
              set -e
              set -x
              echo "Starting Docker deployment in ${{ env.EC2_DOCKER_DIR }}"
              sudo -n bash -c "cd ${{ env.EC2_DOCKER_DIR }} && pwd"
              echo "Checking disk space before build"
              if ! sudo -n df -h / | grep -q '[0-9]G'; then
                echo "Insufficient disk space"
                exit 1
              fi
              echo "Cleaning up existing fastapi-app container"
              if sudo -n docker ps -a -q -f name=${{ env.DOCKER_IMAGE }} | grep -q .; then
                echo "Stopping and removing container ${{ env.DOCKER_IMAGE }}"
                sudo -n docker stop ${{ env.DOCKER_IMAGE }} || true
                sudo -n docker rm ${{ env.DOCKER_IMAGE }} || true
              fi
              echo "Cleaning up containers using port 8000"
              sudo -n docker ps -a -q -f "publish=8000" | while read -r cid; do
                echo "Stopping and removing container $cid"
                sudo -n docker stop "$cid" || true
                sudo -n docker rm "$cid" || true
              done
              echo "Checking for lingering processes on port 8000"
              if sudo -n lsof -i :8000; then
                echo "Killing processes on port 8000"
                sudo -n lsof -i :8000 | grep LISTEN | awk "{print \$2}" | xargs -r sudo kill -9
                sleep 2
              fi
              echo "Verifying port 8000 is free"
              if sudo -n lsof -i :8000; then
                echo "Port 8000 is still in use"
                sudo -n lsof -i :8000
                exit 1
              fi
              echo "Cleaning up Docker to free space"
              sudo -n docker system prune -a -f --volumes
              if [ $? -ne 0 ]; then
                echo "Docker cleanup failed"
                exit 1
              fi
              echo "Checking Docker version"
              sudo -n docker --version
              if [ $? -ne 0 ]; then
                echo "Docker not installed or inaccessible"
                exit 1
              fi
              echo "Building Docker image: ${{ env.DOCKER_IMAGE }}"
              echo "Build started at $(date)"
              sudo -n bash -c "cd ${{ env.EC2_DOCKER_DIR }} && docker build -t ${{ env.DOCKER_IMAGE }} ."
              if [ $? -ne 0 ]; then
                echo "Docker build failed"
                exit 1
              fi
              echo "Build finished at $(date)"
              echo "Running new container"
              sudo -n bash -c "cd ${{ env.EC2_DOCKER_DIR }} && docker run -d \
                --name ${{ env.DOCKER_IMAGE }} \
                --restart unless-stopped \
                -p 8000:8000 \
                --env-file .env \
                ${{ env.DOCKER_IMAGE }}"
              if [ $? -ne 0 ]; then
                echo "Failed to run Docker container"
                exit 1
              fi
              echo "Waiting for container to stabilize"
              sleep 10
              echo "Verifying container status"
              sudo -n docker ps -f name=${{ env.DOCKER_IMAGE }}
              if [ $? -ne 0 ]; then
                echo "Container not running"
                sudo -n docker logs ${{ env.DOCKER_IMAGE }}
                exit 1
              fi
              echo "Testing endpoint"
              sudo -n curl -f -v http://localhost:8000/get-application-logs || {
                echo "Endpoint test failed"
                sudo -n docker logs ${{ env.DOCKER_IMAGE }}
                exit 1
              }
              echo "Cleaning up unused Docker images"
              sudo -n docker image prune -f
              if [ $? -ne 0 ]; then
                echo "Docker image cleanup failed"
                exit 1
              fi
              echo "Displaying container logs"
              sudo -n docker logs ${{ env.DOCKER_IMAGE }}
              echo "Docker deployment completed successfully"
            '
        if: success()
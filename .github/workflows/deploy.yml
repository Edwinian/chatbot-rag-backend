name: Docker Deploy FastAPI to EC2

on:
  push:
    branches: [master]

env:
  DOCKER_IMAGE: fastapi-app
  EC2_DOCKER_DIR: /root/chatbot-rag-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.EC2_SSH_KEY }}
          known_hosts: ${{ secrets.EC2_HOST }}

      - name: Create Directory Structure
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=5 ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} '
            set -e
            set -x
            echo "Creating directory: ${{ env.EC2_DOCKER_DIR }}"
            sudo -n mkdir -p ${{ env.EC2_DOCKER_DIR }}
            sudo -n chown $USER:$USER ${{ env.EC2_DOCKER_DIR }}
            sudo -n chmod 755 ${{ env.EC2_DOCKER_DIR }}
            echo "Directory created successfully"
          '

      - name: Initialize or Update Git Repository
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 5
          retry_wait_seconds: 30
          command: |
            ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ConnectionAttempts=3 -o ServerAliveInterval=60 -o ServerAliveCountMax=5 ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} '
              set -e
              set -x
              echo "Starting Git repository setup in ${{ env.EC2_DOCKER_DIR }}"
              
              # Change to directory
              cd ${{ env.EC2_DOCKER_DIR }}
              
              # Configure git credentials temporarily
              git config --global credential.helper "store --file=/tmp/git-credentials"
              echo "https://${{ secrets.GIT_USERNAME }}:${{ secrets.GIT_PAT }}@github.com" > /tmp/git-credentials
              
              if [ -d .git ]; then
                echo "Updating existing repository"
                git fetch origin
                git checkout master
                git reset --hard origin/master
              else
                echo "Cloning new repository"
                git clone https://${{ secrets.GIT_USERNAME }}:${{ secrets.GIT_PAT }}@github.com/${{ secrets.REPO_URL }} .
                git checkout master
              fi
              
              # Clean up credentials
              rm -f /tmp/git-credentials
              git config --global --unset credential.helper
              
              echo "Git repository setup completed"
            '

      - name: Create and Secure .env File
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 1
          command: |
            ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=5 ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} '
              set -e
              set -x
              echo "Creating .env file in ${{ env.EC2_DOCKER_DIR }}"
              cd ${{ env.EC2_DOCKER_DIR }}
              
              cat > .env << EOF
              HUGGINGFACE_TOKEN=${{ secrets.HUGGINGFACE_TOKEN }}
              SERPAPI_KEY=${{ secrets.SERPAPI_KEY }}
              FRONTEND_URL=http://${{ secrets.EC2_HOST }}:3001
              EOF
              
              chmod 600 .env
              echo ".env file created and secured"
            '

      # ... rest of your existing steps remain the same
      - name: Free Disk Space
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=5 ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} '
            set -e
            set -x
            sudo -n apt-get clean
            sudo -n docker system prune -a -f --volumes
            sudo -n rm -rf /var/lib/apt/lists/*
            sudo -n journalctl --vacuum-size=50M
          '

      - name: Configure Hostname Resolution
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=5 ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} '
            set -e
            set -x
            HOSTNAME=$(hostname)
            echo "Current hostname: $HOSTNAME"
            
            if ! grep -q "$HOSTNAME" /etc/hosts; then
              echo "Adding hostname to /etc/hosts"
              echo "127.0.0.1 $HOSTNAME" | sudo tee -a /etc/hosts
              echo "::1 $HOSTNAME" | sudo tee -a /etc/hosts
            else
              echo "Hostname already exists in /etc/hosts"
            fi
          '

      - name: Deploy Docker Container
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 1
          command: |
            ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=5 ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} '
              set -e
              set -x
              echo "Starting Docker deployment in ${{ env.EC2_DOCKER_DIR }}"
              cd ${{ env.EC2_DOCKER_DIR }}
              
              # Clean up existing containers
              echo "Cleaning up existing containers"
              sudo docker stop ${{ env.DOCKER_IMAGE }} 2>/dev/null || true
              sudo docker rm ${{ env.DOCKER_IMAGE }} 2>/dev/null || true
              
              # Build and run new container
              echo "Building Docker image: ${{ env.DOCKER_IMAGE }}"
              sudo docker build -t ${{ env.DOCKER_IMAGE }} .
              
              echo "Running new container"
              sudo docker run -d \
                --name ${{ env.DOCKER_IMAGE }} \
                --restart unless-stopped \
                -p 8000:8000 \
                --env-file .env \
                ${{ env.DOCKER_IMAGE }}
              
              echo "Deployment completed successfully"
            '